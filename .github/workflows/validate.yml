name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  QE_DOTNET_SDK_VERSION: 9.0.312
  QE_CMAKE_VERSION: 4.0.2
  QE_VULKAN_SDK_VERSION: 1.4.357.0
  QE_VULKAN_SDK_SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d

jobs:
  windows-build:
    name: Windows build and package
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.QE_DOTNET_SDK_VERSION }}

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.QE_CMAKE_VERSION }}

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $sdkVersion = $env:QE_VULKAN_SDK_VERSION
          $installerUri = "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/vulkan_sdk.exe?Human=true"
          $installerPath = Join-Path $env:RUNNER_TEMP "vulkan-sdk-$sdkVersion.exe"
          $sdkRoot = Join-Path 'C:\VulkanSDK' $sdkVersion

          Invoke-WebRequest -Uri $installerUri -OutFile $installerPath

          $actualSha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:QE_VULKAN_SDK_SHA256) {
            throw "Vulkan SDK checksum mismatch. Expected $env:QE_VULKAN_SDK_SHA256, got $actualSha256."
          }

          $installArgs = @(
            '--root', $sdkRoot,
            '--accept-licenses',
            '--default-answer',
            '--confirm-command',
            'install'
          )

          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList $installArgs `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          if ($process.ExitCode -ne 0) {
            throw "Vulkan SDK installer failed with exit code $($process.ExitCode)."
          }

          $requiredPaths = @(
            (Join-Path $sdkRoot 'Include'),
            (Join-Path $sdkRoot 'Lib\vulkan-1.lib'),
            (Join-Path $sdkRoot 'Bin\glslc.exe')
          )
          $missingPaths = @($requiredPaths | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missingPaths.Count -gt 0) {
            throw "Vulkan SDK installation is incomplete. Missing:`n$($missingPaths -join "`n")"
          }

          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build engine, editor and launcher
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File '.\setup\build.ps1' -Configuration Both

      - name: Verify generated shaders are committed
        shell: pwsh
        run: |
          git diff --exit-code -- resources/shaders

      - name: Build launcher Release
        shell: pwsh
        run: |
          dotnet build '.\src\QuarantineLauncher\QuarantineLauncher.csproj' --configuration Release --no-restore

      - name: Build generated-project example
        shell: pwsh
        run: |
          msbuild '.\QEProjects\QEExample\QEExample.sln' /t:Build /p:Configuration=Debug /p:Platform=x64 /v:minimal
          msbuild '.\QEProjects\QEExample\QEExample.sln' /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Package engine SDK
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File '.\setup\package-engine.ps1' `
            -Version '0.1.0-ci' `
            -Channel 'dev' `
            -Configuration Both

          $packageRoot = '.\artifacts\packages\quarantine-engine\0.1.0-ci\win-x64'
          $requiredPackageFiles = @(
            "$packageRoot\metadata\manifest.json",
            "$packageRoot\package.zip",
            "$packageRoot\lib\Debug\Joltd.lib",
            "$packageRoot\lib\Debug\ktxd.lib",
            "$packageRoot\lib\Release\Jolt.lib",
            "$packageRoot\lib\Release\ktx.lib"
          )
          $missingPackageFiles = @($requiredPackageFiles | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missingPackageFiles.Count -gt 0) {
            throw "Engine package is incomplete. Missing:`n$($missingPackageFiles -join "`n")"
          }
